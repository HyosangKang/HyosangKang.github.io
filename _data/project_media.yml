calculus-3d-graphing:
  source_images:
    - src: /assets/img/projects/calculus-3d-graphing-source.png
      alt: A wireframe surface made from the sine and cosine functions.
      caption: A surface generated by the graphing code in the original calculus materials.

calculus-captcha:
  source_images:
    - src: /assets/img/projects/calculus-captcha-source.png
      alt: A CAPTCHA image made from four distorted blue characters.
      caption: A CAPTCHA produced in the original project materials.

calculus-polygon-area:
  examples:
    - title: Fill!
      src: /game/fill/main.html
      aspect_ratio: 4 / 3
      description: Draw a polygon with the requested number of vertices and try to match the target area. The program computes the area from the vertices.
      instructions: Click once to start, then left-click to place each vertex. Right-click returns to the start.

differential-equations-epidemic:
  examples:
    - title: Virus!
      src: /game/virus/main.html
      aspect_ratio: 4 / 3
      description: An agent-based epidemic example in which contact changes agents from healthy to exposed, infected, and recovered.
      instructions: Press Enter to start. The colours show each agent’s current state.
    - title: Predator!
      src: /game/predator/main.html
      aspect_ratio: 4 / 3
      description: A related population-dynamics example with interacting human, fish, and coral populations.
      instructions: Press Enter to start. Use Q, W, and E to add humans, fish, and coral.

differential-equations-stone-skipping:
  examples:
    - title: Throw!
      src: /game/throw/main.html
      aspect_ratio: 3 / 1
      description: A compact projectile-motion model for experimenting with launch direction, velocity, and gravity before adding water impacts.
      instructions: Click and drag from the launch point, then release to throw.
    - title: Rocket!
      src: /game/rocket/main.html
      aspect_ratio: 1 / 1
      description: A related motion model in which a launched object follows a path under a central gravitational force.
      instructions: Press Enter, then click and drag from the rocket to choose its initial velocity.

differential-equations-electric-circuit:
  source_images:
    - src: /assets/img/projects/differential-equations-electric-circuit-source.png
      alt: A series circuit with an inductor, resistor, capacitor, and voltage source.
      caption: The RLC circuit used in the original engineering-mathematics material.

linear-algebra-3d-visualization:
  examples:
    - title: Rotate!
      src: /game/rotate/main.html
      aspect_ratio: 1 / 1
      description: A playable example that applies rotation matrices and scaling to a wireframe torus.
      instructions: Press Enter. Use W/S, Q/E, and A/D for the three rotation axes; use Up/Down to zoom.

closed-geodesics-modular-surfaces:
