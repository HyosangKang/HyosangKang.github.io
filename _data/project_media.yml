calculus-calculator:
  examples:
    - title: Calculator!
      src: /game/calculator/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/math-arcade
      aspect_ratio: 16 / 10
      description: Build numbers one digit at a time and apply one arithmetic operation at a time, just as a basic calculator does.
      instructions: Click the number and operation keys. Use = to finish a calculation, BACK to remove the last digit, and C to clear.

calculus-3d-graphing:
  source_images:
    - src: /assets/img/projects/calculus-3d-graphing-source.png
      alt: A wireframe surface made from the sine and cosine functions.
      caption: A surface generated by the graphing code in the original calculus materials.

calculus-captcha:
  source_images:
    - src: /assets/img/projects/calculus-captcha-source.png
      alt: A CAPTCHA image made from four distorted blue characters.
      caption: A CAPTCHA produced in the original project materials.

calculus-polygon-area:
  examples:
    - title: Fill!
      src: /game/fill/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/fill
      aspect_ratio: 4 / 3
      description: Draw a polygon with the requested number of vertices and try to match the target area. The program computes the area from the vertices.
      instructions: Click once to start, then left-click to place each vertex. Right-click returns to the start.

calculus-curve-length:
  examples:
    - title: Curve Length!
      src: /game/curve-length/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/math-arcade
      aspect_ratio: 16 / 10
      description: Approximate a smooth curve with straight segments and watch the total length settle as the segments become shorter.
      instructions: Use + and − to change the number of line segments. Compare the gold approximation with the cyan curve and the reference length.

differential-equations-epidemic:
  examples:
    - title: Virus!
      src: /game/virus/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/virus
      aspect_ratio: 4 / 3
      description: An agent-based epidemic example in which contact changes agents from healthy to exposed, infected, and recovered.
      instructions: Press Enter to start. The colours show each agent’s current state.

differential-equations-stone-skipping:
  examples:
    - title: Stone Skipping
      src: /game/stone-skipping/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/stone-skipping
      aspect_ratio: 16 / 10
      description: A simple old-style game based on the attached MATLAB model, with gravity in air and speed-dependent lift and drag during water contact.
      instructions: Press Enter or click to begin. Drag backward from the stone and release; Enter uses the MATLAB default shot. Use Space to pause, R to reset, or Esc for the title.

differential-equations-projectile-motion:
  examples:
    - title: Throw!
      src: /game/throw/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/throw
      aspect_ratio: 2 / 1
      description: Choose an initial velocity and watch gravity turn it into a projectile trajectory.
      instructions: Press Enter or click to begin. Drag backward from the ball and release to throw it. Press R after landing to reset or Esc for the title.

differential-equations-orbital-motion:
  examples:
    - title: Rocket!
      src: /game/rocket/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/rocket
      aspect_ratio: 1 / 1
      description: Launch an object inside a central gravitational field and compare collision and curved-flight paths.
      instructions: Press Enter, then click and drag from the rocket to choose its initial velocity.

differential-equations-ecosystem-populations:
  examples:
    - title: Predator!
      src: /game/predator/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/predator
      aspect_ratio: 4 / 3
      description: Change the numbers of humans, fish, and coral in a simple agent-based food-chain model.
      instructions: Press Enter to start. Use Q, W, and E to add humans, fish, and coral.

differential-equations-lanchester:
  examples:
    - title: Lanchester Arena
      src: /game/lanchester/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/lanchester
      aspect_ratio: 4 / 3
      description: Arrange several coloured forces around an arena, then watch a Go WebAssembly game turn movement and ranged laser attacks into population curves.
      instructions: Choose 2–6 teams and set each force size with the in-game controls. Press Enter to start, Space to pause, R to restart, or Esc to edit. After the battle, compare the matching team-colour survivor curves.

differential-equations-double-spring:
  examples:
    - title: Coupled Motion
      src: /game/double-spring/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/differential-labs
      aspect_ratio: 16 / 10
      description: Set two masses, two spring constants, and four initial values. The exact modal solution drives both the moving spring system and the two displacement traces.
      instructions: Choose a motion preset or enter your own values, then select Apply & run. Use Space to pause, R to restart, or drag the time control.

differential-equations-spring:
  examples:
    - title: Spring!
      src: /game/spring/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/math-arcade
      aspect_ratio: 16 / 10
      description: Change damping and periodic forcing, then compare the moving mass with its displacement trace.
      instructions: Use the DAMP and FORCE buttons to change the model. Press R or click RESET to restart the motion.

differential-equations-electric-circuit:
  examples:
    - title: Current Quest
      src: /game/electric-circuit/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/differential-labs
      aspect_ratio: 16 / 10
      description: Change the inductor, resistors, capacitor, and time interval. The Laplace-transform solution animates current around both loops and traces both current graphs.
      instructions: Choose a response preset or enter component values, then select Apply & run. Use Space to pause, R to restart, or drag the time control.
  source_images:
    - src: /assets/img/projects/differential-equations-electric-circuit-source.png
      alt: A series circuit with an inductor, resistor, capacitor, and voltage source.
      caption: The RLC circuit used in the original engineering-mathematics material.

linear-algebra-3d-visualization:
  examples:
    - title: Rotate!
      src: /game/rotate/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/rotate
      aspect_ratio: 1 / 1
      description: A playable example that applies rotation matrices and scaling to a wireframe torus.
      instructions: Press Enter. Use W/S, Q/E, and A/D for the three rotation axes; use Up/Down to zoom.

quantum-computing-simulator:
  examples:
    - title: Qubit!
      src: /game/quantum-simulator/main.html
      source_url: https://github.com/HyosangKang/HyosangKang.github.io/tree/master/game-source/math-arcade
      aspect_ratio: 16 / 10
      description: Apply simple quantum gates to one qubit, then connect its state vector with the probabilities of measuring 0 or 1.
      instructions: Use X, H, and Z to change the state. Click MEASURE to sample an outcome and RESET to return to |0⟩.

closed-geodesics-modular-surfaces:
  source_images:
    - src: /assets/img/projects/closed-geodesics-modular-surfaces-source.png
      alt: A hyperbolic triangle and geodesic arcs in a Poincaré disk.
      caption: A Poincaré-disk construction from the hyperbolic-geometry research materials.

escherian-images-hyperbolic-tilings:
  source_images:
    - src: /assets/img/projects/escherian-images-hyperbolic-tilings-source.png
      alt: A dense symmetric tiling in a Poincaré disk.
      caption: A computed hyperbolic tiling from the source research repository.

graph-states-stabilizer-eigenstates:
  source_images:
    - src: /assets/img/projects/graph-states-stabilizer-eigenstates-source.png
      alt: An X-type ancilla qubit joined to a data qubit.
      caption: A stabilizer-measurement building block from the surface-code research materials.

neural-network-decoders-surface-codes:
  source_images:
    - src: /assets/img/projects/neural-network-decoders-surface-codes-source.png
      alt: Logical error-rate curves for surface codes of several distances.
      caption: Decoder performance curves from the surface-code research materials.

quantum-error-correction:
  source_images:
    - src: /assets/img/projects/quantum-error-correction-1.png
      alt: A surface-code lattice containing highlighted error paths.
      caption: A sample surface-code error configuration from the project source.
    - src: /assets/img/projects/quantum-error-correction-2.png
      alt: A surface-code lattice after an error-correction step.
      caption: The corresponding correction selected by the decoder.
    - src: /assets/img/projects/quantum-error-correction-3.png
      alt: A plot of logical error behaviour from repeated decoding trials.
      caption: Simulation results used to evaluate the correction method.

visual-tools-hyperbolic-geometry:
  source_images:
    - src: /assets/img/projects/visual-tools-hyperbolic-geometry-source.png
      alt: A hyperbolic tiling drawn inside a Poincaré disk.
      caption: A Poincaré-disk rendering from the hyperbolic-geometry research repository.

rauzy-fractal:
  source_only: true
  instructional_images:
    - src: /assets/img/projects/rauzy-method.png
      alt: A three-step diagram showing a substitution word, its prefix-count lattice path, and projection to a Rauzy fractal.
      caption: "Method: iterate a symbolic substitution, count prefixes as a lattice path, then remove the expanding direction by projecting onto the contracting plane."
    - src: /assets/img/projects/rauzy-self-similarity.png
      alt: A Rauzy fractal separated into three coloured pieces, each resembling a transformed copy of the whole.
      caption: "Structure: separating points by their final symbol reveals smaller transformed pieces that fit back into the complete fractal."
  source_images:
    - src: /assets/img/projects/rauzy-fractal-1.png
      alt: A two-dimensional Rauzy fractal divided into three coloured pieces.
      caption: A two-dimensional Rauzy fractal computed in the project repository.
    - src: /assets/img/projects/rauzy-fractal-2.png
      alt: A three-dimensional Rauzy fractal divided into three coloured pieces.
      caption: A three-dimensional projection produced from the same symbolic substitution.

qubo:
  source_only: true
  instructional_images:
    - src: /assets/img/projects/qubo-motivation.png
      alt: A graph-colouring problem becomes a higher-degree binary objective that must be reduced to the quadratic form accepted by a quantum annealer.
      caption: "Motivation: compact graph-colouring encodings create terms above degree two, but a quantum annealer accepts pairwise terms. Each auxiliary bit introduced during reduction consumes another physical resource."
    - src: /assets/img/projects/qubo-symmetric-reduction.png
      alt: Ten cubic monomials reduced separately with ten auxiliary bits compared with one symmetric block reduced using two auxiliary bits.
      caption: "Main idea: conventional methods reduce each monomial separately. The new method recognizes a homogeneous symmetric block and reduces its shared structure together."
    - src: /assets/img/projects/qubo-resource-comparison.png
      alt: Bar charts comparing monomial and symmetric reductions for an eight-vertex complete graph, showing fewer binary variables and quadratic terms.
      caption: "Result for K₈ with eight colours: symmetric reduction uses 480 variables instead of 1,180 and 2,797 quadratic terms instead of 5,849."
      wide: true

hyperbolic-surface-code:
  source_only: true
  instructional_images:
    - src: /assets/img/projects/hyperbolic-surface-code-motivation.png
      alt: An established square surface-code lattice beside the computed two-three-seven hyperbolic surface-code model.
      caption: "Motivation: compare the familiar Euclidean surface-code layout with the actual computed (2,3,7) hyperbolic model used in this project."
    - src: /assets/img/projects/hyperbolic-surface-code-boundary-chains.svg
      alt: Two disjoint boundary-to-boundary X-error chains in the computed four-four-four hyperbolic surface code.
      caption: "Logical structure: the red and purple paths are two computed, data-and-check-disjoint chains joining different logical boundary classes in the (4,4,4) layer-0 code."
  source_images:
    - src: /assets/img/projects/hyperbolic-surface-code-1.png
      alt: Three views of surface codes, a curved geometric cell, and a hyperbolic code lattice.
      caption: Euclidean, spherical, and hyperbolic structures considered in the research project.
    - src: /assets/img/projects/hyperbolic-surface-code-2.png
      alt: A hyperbolic surface-code lattice contained in a circular model.
      caption: A computed layer of a hyperbolic surface code.
    - src: /assets/img/projects/hyperbolic-surface-code-3.png
      alt: Logical error-rate curves for hyperbolic surface-code layers.
      caption: Threshold behaviour measured across several code layers.

automated-timetabling-algorithm:
  source_only: true
  instructional_images:
    - src: /assets/img/projects/automated-timetabling-method.png
      alt: Courses, rooms, instructors, and student plans enter a backtracking constraint search that produces a reviewable timetable.
      caption: "Method: combine course, room, instructor, and student requirements; place the most constrained courses first; reject conflicts; and backtrack when a choice blocks completion."
      wide: true
  source_images:
    - src: /assets/img/projects/automated-timetabling-progress-source.png
      alt: The DATA app showing automatic timetable generation at 88 percent and the courses currently being processed.
      caption: "Output in progress: the app reports generation progress and shows which courses are hardest to place."
      wide: true
    - src: /assets/img/projects/automated-timetabling-review-source.png
      alt: The DATA app timetable review screen showing course blocks and warnings for student and classroom conflicts after moving a block.
      caption: "Human review remains part of the workflow: an administrator can move a course block, see student and room conflicts immediately, undo changes, and save the revised timetable."
      wide: true
