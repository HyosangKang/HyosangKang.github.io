<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A browser simulation of the DATA automated university timetabling application."
    />
    <title>DATA — Automated Timetabling Demo</title>
    <link rel="stylesheet" href="app.css" />
    <script src="wasm_exec.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="../../explore/automated-timetabling-algorithm/">
        <span class="brand-word">DATA</span>
        <span class="brand-subtitle">DGIST Automated Timetabling Algorithm</span>
      </a>

      <nav class="main-nav" aria-label="Application sections">
        <button class="nav-item is-active" type="button" data-tab="courses">
          Courses
        </button>
        <button class="nav-item" type="button" data-tab="instructors">
          Instructor
        </button>
        <button class="nav-item" type="button" data-tab="students">
          Students
        </button>
        <button class="nav-item" type="button" data-tab="classrooms">
          Classroom
        </button>
        <button class="nav-item" type="button" data-tab="timetable">
          Timetable
        </button>
        <button class="nav-item" type="button" data-tab="settings">
          Settings
        </button>
        <button class="nav-item" type="button" data-tab="help">Help</button>
      </nav>

      <div class="header-actions">
        <span class="demo-badge">Browser demo</span>
        <span class="term-badge">2026 spring</span>
        <a class="sample-link" href="sample-data.xlsx" download>
          Download sample data (.xlsx)
        </a>
      </div>
    </header>

    <div id="engine-banner" class="engine-banner" role="status" aria-live="polite">
      <span class="engine-dot"></span>
      <span id="engine-status">Starting the WebAssembly engine…</span>
    </div>

    <main id="app-content" class="app-content" aria-live="polite"></main>

    <input
      id="workbook-file"
      type="file"
      accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      hidden
    />

    <template id="file-toolbar-template">
      <div class="file-toolbar">
        <button class="button button-primary choose-workbook" type="button">
          Open data file
        </button>
        <span class="loaded-file">Sample data.xlsx</span>
        <span class="privacy-copy">Processed locally in this browser</span>
      </div>
    </template>

    <noscript>
      <p class="noscript">JavaScript is required to run this interactive demo.</p>
    </noscript>
  </body>
</html>
